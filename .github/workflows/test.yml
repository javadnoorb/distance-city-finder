name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for file in app.js lib/*.js scripts/*.mjs; do node --check "$file"; done
      - name: Unit tests
        run: npm test
      - name: Check data/cities-large.json is up to date
        run: |
          node scripts/build-large-cities.mjs
          git diff --exit-code -- data/cities-large.json
