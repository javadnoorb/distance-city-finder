<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Distance City Finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Distance City Finder</h1>
        <p class="intro">
          Enter a location, target distance, and margin of error to find cities that fall
          within that distance ring. Results are sorted by population.
        </p>

        <form id="search-form" class="search-form">
          <label>
            <span>Your location</span>
            <input
              id="location"
              name="location"
              type="text"
              placeholder="City name, optional country code, or latitude,longitude"
              required
            />
          </label>

          <div class="field-row">
            <label>
              <span>Desired distance (miles)</span>
              <input id="distance" name="distance" type="number" min="0" step="any" required />
            </label>

            <label>
              <span>Margin of error (miles)</span>
              <input
                id="margin"
                name="margin"
                type="number"
                min="0"
                step="any"
                value="20"
                required
              />
            </label>
          </div>

          <button type="submit">Find cities</button>
        </form>

        <p class="hint">Tip: try <code>Chicago</code>, <code>Paris, FR</code>, or coordinates like <code>41.8781,-87.6298</code>.</p>
        <p id="status" class="status" aria-live="polite"></p>
        <p id="error" class="error" aria-live="assertive"></p>
      </section>

      <section id="results-panel" class="panel results-panel" hidden>
        <div class="results-header">
          <h2>Matching cities</h2>
          <p id="results-summary"></p>
        </div>
        <div class="results-table-wrapper">
          <table>
            <thead>
              <tr>
                <th>City</th>
                <th>Country</th>
                <th>Population</th>
                <th>Distance (mi)</th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
